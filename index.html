
<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/RMMC-MI-IT-Support/">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="RMMC-MI IT Service Request and Technical Support Tracking System."
  >

  <meta name="theme-color" content="#0A1F44">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black"
  >
  <meta
    name="apple-mobile-web-app-title"
    content="ITSupport"
  >

  <link rel="icon" type="image/png" href="favicon.png">
  <link
    rel="apple-touch-icon"
    href="icons/Icon-192.png"
  >
  <link rel="manifest" href="manifest.json">

  <title>ITSupport | RMMC-MI</title>

  <style>
    :root {
      --navy: #06152E;
      --navy-light: #0A1F44;
      --blue: #087DF5;
      --cyan: #30C8FF;
      --white: #FFFFFF;
      --muted: #A9C2DF;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      overflow: hidden;
      background-color: var(--navy-light);
      font-family: "Segoe UI", Arial, sans-serif;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(8, 125, 245, 0.17),
          transparent 46%
        ),
        linear-gradient(
          145deg,
          #06152E 0%,
          #0A1F44 55%,
          #071730 100%
        );
      overflow: hidden;
      transition:
        opacity 450ms ease,
        visibility 450ms ease;
    }

    #splash.splash-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-background {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .ambient-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 430px;
      height: 430px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(8, 125, 245, 0.24),
        rgba(48, 200, 255, 0.045) 50%,
        transparent 72%
      );
      filter: blur(35px);
      animation: ambientPulse 4s ease-in-out infinite;
    }

    .circle-one,
    .circle-two {
      position: absolute;
      top: 50%;
      left: 50%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(48, 200, 255, 0.07);
    }

    .circle-one {
      width: 440px;
      height: 440px;
    }

    .circle-two {
      width: 610px;
      height: 610px;
      border-color: rgba(48, 200, 255, 0.035);
    }

    .splash-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      max-width: 430px;
      padding: 24px;
      animation: entrance 750ms ease-out both;
    }

    .logo-wrapper {
      position: relative;
      width: 250px;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .logo-glow {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: rgba(8, 125, 245, 0.27);
      filter: blur(35px);
      animation: logoPulse 3s ease-in-out infinite;
    }

    .logo-image {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: transparent;
      border: none;
      animation: logoFloat 3.5s ease-in-out infinite;
      filter: drop-shadow(
        0 12px 24px rgba(8, 125, 245, 0.20)
      );
    }

    .app-subtitle {
      margin-top: 5px;
      color: #D5E7FA;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      line-height: 1.6;
    }

    .divider-line {
      width: 45px;
      height: 3px;
      margin-top: 26px;
      border-radius: 20px;
      background: linear-gradient(
        90deg,
        var(--blue),
        var(--cyan)
      );
    }

    .loading-container {
      width: 100%;
      max-width: 245px;
      margin-top: 31px;
    }

    .loading-track {
      position: relative;
      width: 100%;
      height: 4px;
      overflow: hidden;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.12);
    }

    .loading-progress {
      position: absolute;
      top: 0;
      bottom: 0;
      left: -45%;
      width: 45%;
      border-radius: 20px;
      background: linear-gradient(
        90deg,
        var(--blue),
        var(--cyan)
      );
      box-shadow: 0 0 15px rgba(48, 200, 255, 0.45);
      animation: loadingTravel 1.55s ease-in-out infinite;
    }

    .loading-label {
      margin-top: 18px;
      color: #B6CBE4;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.1px;
      animation: textPulse 2s ease-in-out infinite;
    }

    .footer {
      position: absolute;
      bottom: 30px;
      left: 0;
      right: 0;
      z-index: 2;
      padding: 0 15px;
      color: rgba(190, 212, 235, 0.55);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.6px;
      text-align: center;
    }

    @keyframes entrance {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes logoFloat {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-7px);
      }
    }

    @keyframes logoPulse {
      0%, 100% {
        opacity: 0.6;
        transform: scale(0.94);
      }

      50% {
        opacity: 1;
        transform: scale(1.08);
      }
    }

    @keyframes ambientPulse {
      0%, 100% {
        opacity: 0.6;
      }

      50% {
        opacity: 1;
      }
    }

    @keyframes loadingTravel {
      0% {
        left: -45%;
      }

      55% {
        left: 55%;
      }

      100% {
        left: 110%;
      }
    }

    @keyframes textPulse {
      0%, 100% {
        opacity: 0.55;
      }

      50% {
        opacity: 1;
      }
    }

    @media (max-width: 480px) {
      .splash-content {
        padding: 20px;
      }

      .logo-wrapper {
        width: 205px;
        height: 205px;
      }

      .logo-glow {
        width: 165px;
        height: 165px;
      }

      .app-subtitle {
        font-size: 10px;
        letter-spacing: 1.4px;
      }

      .circle-one {
        width: 350px;
        height: 350px;
      }

      .circle-two {
        width: 460px;
        height: 460px;
      }

      .footer {
        bottom: 20px;
        font-size: 9px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

  <script>
    let splashRemoving = false;

    function removeSplashFromWeb() {
      if (splashRemoving) return;

      splashRemoving = true;

      const splash = document.getElementById("splash");

      if (!splash) {
        document.body.style.background = "transparent";
        return;
      }

      splash.classList.add("splash-hidden");

      const removeSplash = function () {
        splash.remove();
        document.body.style.background = "transparent";
      };

      splash.addEventListener(
        "transitionend",
        removeSplash,
        { once: true }
      );

      setTimeout(removeSplash, 600);
    }

    window.addEventListener(
      "flutter-first-frame",
      removeSplashFromWeb,
      { once: true }
    );
  </script>
</head>

<body>
  <div
    id="splash"
    role="status"
    aria-label="ITSupport application loading"
  >
    <div class="splash-background" aria-hidden="true">
      <div class="ambient-glow"></div>
      <div class="circle-one"></div>
      <div class="circle-two"></div>
    </div>

    <div class="splash-content">
      <div class="logo-wrapper">
        <div class="logo-glow"></div>

        <img
          class="logo-image"
          src="assets/images/itsupport_logo_transparent.png"
          alt="ITSupport Logo"
          fetchpriority="high"
        >
      </div>

      <div class="app-subtitle">
        RMMC-MI IT SERVICE PORTAL
      </div>

      <div class="divider-line" aria-hidden="true"></div>

      <div class="loading-container">
        <div class="loading-track" aria-hidden="true">
          <div class="loading-progress"></div>
        </div>

        <div class="loading-label">
          INITIALIZING SYSTEM...
        </div>
      </div>
    </div>

    <div class="footer">
      RAMON MAGSAYSAY MEMORIAL COLLEGES - MARBEL, INC.
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
